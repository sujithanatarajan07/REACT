
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Enquiry</title>
    <link rel="stylesheet" href="College.css">
</head>
<body>

    <header>
        <h1>COLLEGE ADMISSION 2026</h1>
        <p>Build Your Future With Us</p>
    </header>

    <main class="container">
        <form id="admissionForm">
            <h2>ONLINE ADMISSION ENQUIRY - 2026</h2>

            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile"
                   pattern="[0-9]{10}"
                   maxlength="10"
                   placeholder="10-digit mobile number" required>

            <label for="email">Email</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" required>

            <label for="age">Age</label>
            <input type="number" id="age"
                   placeholder="Age will calculate automatically"
                   readonly required>

            <label for="mark">12th Mark (Out of 600)</label>
            <input type="number" id="mark"
                   min="0" max="600"
                   placeholder="Enter your 12th mark" required>

            <label for="address">Address</label>
            <textarea id="address"
                      placeholder="Enter your address"
                      rows="3" required></textarea>

            <button type="submit">Apply Now</button>

            <p id="message" role="status"></p>
        </form>
    </main>

    <footer>
        <p>© 2026 College Admission Enquiry</p>
    </footer>

    <script src="College.jsx"></script>
</body>
</html>
